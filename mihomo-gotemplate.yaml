{{- /*
  Go 模板版配置（与 YAML 覆写版产出同一份结果，但由模板自己写全整份结构）。

  为什么写法和 YAML 覆写版差别这么大：
  1. Go 模板不基于系统自动生成的基础配置，proxies 必须由模板自己输出。
     节点的 ws-opts / reality-opts / grpc-opts 等是嵌套结构，直接
     {{ $v }} 打印会写成 Go 的 map[k:v] 语法而非 YAML，内核会拒绝加载，
     所以统一用 proxiesYaml 序列化。
  2. YAML 锚点（&pr / *pr）是 YAML 语法，Go 模板阶段还没有 YAML 解析器，
     用不了。这里改用模板变量 $pr / $pr1 / $class 承担同样的"定义一次、
     复用多处"职责，效果等价。

  可用辅助函数：proxiesYaml / proxyYaml / toYaml / indent / names / quote
*/ -}}
{{- /* 以下三个变量只存"字段内容"，不含外层花括号，由使用处补 { } */ -}}
{{- $pr := "type: select, proxies: [👵 大妈节点,🐂 所有-手动,🐳 所有-自动,DIRECT]" -}}
{{- $pr1 := "type: select, proxies: [DIRECT,REJECT,👵 大妈节点,🦁 香港-自动,🎌 日本-自动,🏝️ 台湾-自动,🌿 新加坡-自动,💄 韩国-自动,🦅 美国-自动,🐳 所有-自动,🌀 其他-自动,🐂 所有-手动]" -}}
{{- $pr2 := "type: fallback, proxies: [🦁 香港-自动, 💄 韩国-自动, 🎌 日本-自动, 🏝️ 台湾-自动, 👵 大妈节点, DIRECT]" -}}
{{- $class := "type: http, interval: 86400, behavior: classical, format: text" -}}
{{- $base := "https://raw.githubusercontent.com/weni09/clash_my_conf/refs/heads/main/list" -}}
global-ua: clash

# 全局配置
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true

# 节点：Go 模板不继承自动生成的 proxies，需自己输出
proxies:
{{ proxiesYaml .Nodes | indent 2 }}

# 策略组
proxy-groups:
  - {name: 🤖⚡ AI, {{ $pr }} }
  - {name: 🔵🧠 Meta AI, {{ $pr }} }
  - {name: 🔍🧩 Perplexity, {{ $pr }} }
  - {name: 🐙💻 GitHub, {{ $pr }} }
  - {name: 🪂 TikTok, {{ $pr }} }
  - {name: 🙋 Telegram, {{ $pr }} }
  - {name: 🌎 Google, {{ $pr }} }
  - {name: 🕊️ Twitter(X), {{ $pr }} }
  - {name: 🗣️ Facebook, {{ $pr }} }
  - {name: 💁 WhatApp, {{ $pr }} }
  - {name: 🌳 Amazon, {{ $pr }} }
  - {name: 🍎 Apple, {{ $pr }} }
  - {name: Ⓜ️ Microsoft, {{ $pr }} }
  - {name: 🎮 Steam, {{ $pr }} }
  - {name: 🕹️ Game, {{ $pr }} }
  - {name: 🎞️ YouTube, {{ $pr }} }
  - {name: 📺 Disney, {{ $pr }} }
  - {name: 🎥 Netflix, {{ $pr }} }
  - {name: 🎬 HBO MAX, {{ $pr }} }
  - {name: 🎵 Spotify, {{ $pr }} }
  - {name: 👌 虚拟币, {{ $pr }} }
  - {name: ⏱ 检测, {{ $pr1 }} }
  - {name: ✈️ 国外, {{ $pr }} }
  - {name: 🧭 DNS, {{ $pr2 }} }
  - {name: 🐼 国内, {{ $pr1 }} }
  - {name: 🐂 所有-手动, type: select, include-all: true}
  - {name: 🐳 所有-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "^((?!(国内|Ghost|Dmit)).)*$"}
  - {name: 🦁 香港-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?i)广港|香港|HK|Hong Kong|🇭🇰|HongKong"}
  - {name: 🏝️ 台湾-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?i)广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwa"}
  - {name: 🎌 日本-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?i)广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan"}
  - {name: 🌿 新加坡-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?!)广新|新加坡|SG|坡|狮城|🇸🇬|Singapore"}
  - {name: 💄 韩国-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?!)广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea"}
  - {name: 🦅 美国-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?!)广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States"}
  - {name: 🌀 其他-自动, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 180, filter: "(?!)波|柬|尼|也|克|比|尔|立|冰|秘|耳|利|埃|希|孟|芬|愛|澳|英|德|南|意|法|拿|墨|印|越|俄|瑞|智|荷|比|巴|沙|班|泰|德|烏|以|Australia|Konghwaguk"}
  - {name: 👵 大妈节点, type: url-test, lazy: false, include-all: true, tolerance: 50, interval: 120, filter: "Dmit"}

